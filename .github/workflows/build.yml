name: Build and Release

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Tests
        run: npm test --if-present

      - name: Build Project
        run: |
          export VITE_VERSION="$VERSION"
          echo "version=$VITE_VERSION"
          npm run build

      - name: Create tarball
        run: |
          mkdir -p out
          tar -czf "out/js-iotdevice-${VERSION}.tar.gz" --owner=0 --group=0 --numeric-owner -C dist .
          cd out
          sha256sum "js-iotdevice-${VERSION}.tar.gz" > SHA256SUMS

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v6
        with:
          name: js-iotdevice-tarball
          path: out

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@v7
        with:
          name: js-iotdevice-tarball
          path: out

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/js-iotdevice-*.tar.gz out/SHA256SUMS --clobber
