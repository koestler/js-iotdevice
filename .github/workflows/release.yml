name: Frontend tarball

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: |
          export VITE_VERSION=$(git describe --always --tags)
          echo "version=$VITE_VERSION"
          npm run build

      - name: Create tarball
        run: |
          VERSION=$(git describe --always --tags)
          mkdir -p out
          tar -czf "out/js-iotdevice-${VERSION}.tar.gz" --owner=0 --group=0 --numeric-owner -C dist .
          cd out
          sha256sum "js-iotdevice-${VERSION}.tar.gz" > SHA256SUMS

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v6
        with:
          name: js-iotdevice-tarball
          path: out

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" out/js-iotdevice-*.tar.gz out/SHA256SUMS --clobber
